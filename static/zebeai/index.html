<style>
:root { --paper:#fafaf8; --card:#fff; --ink:#1a1a1a; --muted:#6b6862; --line:#e9e7e2; --accent:#2b3a8f; --alert:#a61b1b;
  --display:"Alef","Arial Hebrew",Arial,sans-serif; --body:"IBM Plex Sans Hebrew","Arial Hebrew","Segoe UI",Arial,sans-serif; color-scheme: light; }
html,body { height:100%; margin:0; }
body { background:var(--paper); color:var(--ink); font-family:var(--body); display:grid; place-items:center; padding-inline:16px; box-sizing:border-box; }
.box { width:100%; max-width:420px; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:40px 36px; box-sizing:border-box; display:grid; gap:18px; box-shadow:0 4px 16px rgba(20,18,14,.07); }
.box img { height:60px; justify-self:start; mix-blend-mode:multiply; }
h1 { font-family:var(--display); font-weight:700; font-size:26px; margin:6px 0 0; line-height:1.25; }
p { margin:0; color:var(--muted); font-size:15px; line-height:1.55; }
label { font-size:14px; font-weight:500; }
.row { display:flex; gap:8px; }
input { flex:1; min-width:0; font:16px var(--body); padding:11px 14px; border:1px solid #8f8c85; border-radius:8px; direction:ltr; text-align:left; background:#fff; color:var(--ink); }
input:focus { outline:2px solid var(--accent); outline-offset:1px; border-color:var(--accent); }
button { font:500 16px var(--body); padding:11px 20px; border:0; border-radius:8px; background:var(--accent); color:#fff; cursor:pointer; }
button:focus-visible { outline:2px solid var(--ink); outline-offset:2px; }
button[disabled] { opacity:.6; cursor:default; }
.err { color:var(--alert); font-size:14px; min-height:1.2em; }
.foot { font-size:13px; }
.st { font-size:13px; min-height:1.2em; }
</style>

  <p>הצגה מוקדמת של ממצאי הפרויקט. הגישה למוזמנים בלבד.</p>

const d = new Uint8Array(0);
let BIN = null;
async function getBin(){
  if (BIN) return BIN;
  const r = await fetch('data.bin', {cache:'no-cache'}); if (!r.ok) throw new Error('load');
  BIN = new Uint8Array(await r.arrayBuffer()); return BIN;
}
async function open_(pw){
  const all = await getBin();
  const salt = all.slice(0,16), iv = all.slice(16,28), ct = all.slice(28);
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:250000, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['decrypt']);
  return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM', iv}, key, ct));
}
async function show(pw, remember){
  const pt = await open_(pw);
  const hl = new DataView(pt.buffer).getUint32(0);
  const head = JSON.parse(new TextDecoder().decode(pt.subarray(4, 4+hl)));
  const hs = 4+hl, html = new TextDecoder().decode(pt.subarray(hs, hs+head.html_len)), bs = hs+head.html_len;
  const media = {};
  for (const [k,[type,off,len]] of Object.entries(head.media)) media[k] = URL.createObjectURL(new Blob([pt.subarray(bs+off, bs+off+len)], {type}));
  window.__ZBAI_MEDIA = media;
  if (remember) { try { sessionStorage.setItem('zbai-k', pw); } catch(e){} }
  document.open(); document.write(html); document.close();
}
